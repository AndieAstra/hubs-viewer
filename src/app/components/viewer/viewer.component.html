<div #canvasContainer class="viewer-container">

<div class="mobile-only-buttons">

  @if (!isVRMode) {
    <button class="vr-btn" type="button" (click)="toggleStereo()">
      🎮 Enter VR Mode
    </button>
  }
  @if (isVRMode) {
    <button class="vr-btn" type="button" (click)="toggleStereo()">
      🕶️ Exit VR Mode
    </button>
  }

    <button class="fullscreen-btn" type="button" (click)="onToggleFullscreen()">
      ⛶ Enter/Exit Fullscreen
    </button>
</div>

</div>
