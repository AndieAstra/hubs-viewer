<nav>

  <!-- MOBILE ----------------------------------------------------------->
  @if (isMobile) {

    <!-- Main mobile menu -->
    <div class="mobile-nav mobile-only">
      <button class="mobile-dropdown-toggle" (click)="toggleDropdown()">
        ☰ {{ 'NAV.MENU' | translate }}
      </button>

      <div class="mobile-dropdown-content" [class.show]="dropdownOpen">
        <button (click)="goto('/3dviewer')">   {{ 'NAV.VIEWER'   | translate }}</button>
        <button (click)="goto('/panorama')">   {{ 'NAV.PANORAMA' | translate }}</button>
        <button (click)="goto('/contact')">    {{ 'NAV.CONTACT'  | translate }}</button>
        <button (click)="goto('/bug-report')"> {{ 'NAV.BUG'      | translate }}</button>

        <!-- Test Features Section -->
        <div class="test-dropdown-mobile">
          <hr />
          <strong>{{ 'TEST.TITLE' | translate }}</strong>
          <button (click)="goto('/demo/stereoscope')">{{ 'TEST.STEREOSCOPE' | translate }}</button>
          <button (click)="goto('/demo/forest-vr')">{{ 'TEST.FORESTVR' | translate }}</button>
          <button (click)="goto('/demo/gyroscope-test')">{{ 'TEST.GYROSCOPE' | translate }}</button>
          <button (click)="goto('/demo/editor-frame')">{{ 'TEST.EDITOR' | translate }}</button>
          <button (click)="goto('/viewer')">{{ 'TEST.VIEWER' | translate }}</button>
        </div>
      </div>
    </div>

    <!-- Mobile‑only language switcher -->
    <div class="language-dropdown mobile-only">
      <button class="language-dropdown-toggle" (click)="toggleLangDropdown()">
        {{ 'NAV.LANGUAGE' | translate }}
      </button>

      <div class="language-dropdown-content" [class.show]="langDropdownOpen">
        <button (click)="useLanguage('en')">
          <img src="assets/icons/en.svg" alt="English" width="20" height="20" />
          English
        </button>
        <button (click)="useLanguage('es')">
          <img src="assets/icons/es.svg" alt="Español" width="20" height="20" />
          Español
        </button>
        <!-- <button (click)="useLanguage('yq')"> ... </button> -->
      </div>
    </div>
  }

  <!-- DESKTOP ---------------------------------------------------------->
  @if (!isMobile) {

    <!-- Desktop language switcher -->
    <div class="language-dropdown desktop-only">
      <button class="language-dropdown-toggle" (click)="toggleLangDropdown()">
        {{ 'NAV.LANGUAGE' | translate }}
      </button>
      <div class="language-dropdown-content" [class.show]="langDropdownOpen">
        <button (click)="useLanguage('en')">
          <img src="assets/icons/en.svg" alt="English" width="20" height="20" />
          English
        </button>
        <button (click)="useLanguage('es')">
          <img src="assets/icons/es.svg" alt="Español" width="20" height="20" />
          Español
        </button>
      </div>
    </div>

    <!-- Horizontal button strip -->
    <div class="desktop-nav desktop-only">
      <button (click)="goto('/3dviewer')">   {{ 'NAV.VIEWER'   | translate }}</button>
      <button (click)="goto('/panorama')">   {{ 'NAV.PANORAMA' | translate }}</button>
      <button (click)="goto('/contact')">    {{ 'NAV.CONTACT'  | translate }}</button>
      <button (click)="goto('/bug-report')"> {{ 'NAV.BUG'      | translate }}</button>

      <!-- Test Features dropdown -->
      <div class="test-dropdown desktop-only">
        <button class="test-dropdown-toggle" (click)="toggleTestDropdown()">
          {{ 'TEST.TITLE' | translate }}
        </button>
        <div class="test-dropdown-content" [class.show]="testDropdownOpen">
          <button (click)="goto('/demo/stereoscope')">     {{ 'TEST.STEREOSCOPE' | translate }}</button>
          <button (click)="goto('/demo/forest-vr')">{{ 'TEST.FORESTVR' | translate }}</button>
          <button (click)="goto('/demo/gyroscope-test')">{{ 'TEST.GYROSCOPE' | translate }}</button>
          <button (click)="goto('/demo/editor-frame')"> {{ 'TEST.EDITOR' | translate }}</button>
          <button (click)="goto('/viewer')">{{ 'TEST.VIEWER' | translate }}</button>
        </div>
      </div>
    </div>
  }

</nav>

<router-outlet></router-outlet>
